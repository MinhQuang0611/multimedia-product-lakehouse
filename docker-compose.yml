services:
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${LAKE_ACCESS_KEY:-lakeadmin}
      MINIO_ROOT_PASSWORD: ${LAKE_SECRET_KEY:-lakeadmin123}
      MINIO_DEFAULT_BUCKETS: lake
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
