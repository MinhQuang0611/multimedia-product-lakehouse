services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WH_DB:-warehouse}
      POSTGRES_USER: ${WH_ADMIN_USER:-wh_owner}
      POSTGRES_PASSWORD: ${WH_ADMIN_PASSWORD:?Set WH_ADMIN_PASSWORD in .env}
      WH_APP_USER: wh_app
      WH_APP_PASSWORD: ${WH_APP_PASSWORD:?Set WH_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WH_PORT:-5432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${LAKE_ACCESS_KEY:-lakeadmin}
      MINIO_ROOT_PASSWORD: ${LAKE_SECRET_KEY:-lakeadmin123}
      MINIO_DEFAULT_BUCKETS: lake
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  warehouse-data:
  minio-data:
