<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Viewer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e3e6eb;--acc:#2f5bea;--accsoft:#e8eeff;--good:#16794c;--bad:#b42318;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#9aa3b2;--line:#272c37;--acc:#7b9bff;--accsoft:#1d2540;--good:#47c28a;--bad:#ff8a80;--chip:#222733}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);font:inherit;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{color:var(--acc);background:var(--accsoft);font-weight:600}
#sum{margin-left:auto;color:var(--mute);font-size:12px}
main{padding:16px;max-width:1400px;margin:0 auto}
input,select,textarea,button.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button.btn{cursor:pointer}button.btn:hover:not(:disabled){border-color:var(--acc)}button.btn:disabled{opacity:.4;cursor:default}
button.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input[type=search]{min-width:240px;flex:1;max-width:340px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.pills .lbl{color:var(--mute);font-size:12px;min-width:64px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px;color:var(--ink)}
.pill small{color:var(--mute);margin-left:4px}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}.pill.on small{color:#dfe6ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.item:hover,.item:focus-visible{border-color:var(--acc);outline:none}
.thumb{aspect-ratio:3/4;background:var(--chip);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.tag.n{left:auto;right:6px}
.item .b{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.name{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.mute{color:var(--mute);font-size:12px}.price{font-weight:700}.old{color:var(--mute);text-decoration:line-through;font-size:12px;margin-left:4px}
.off{color:var(--bad);font-size:12px;margin-left:4px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--mute);margin:0 4px 2px 0}
.pager{display:flex;gap:10px;align-items:center;margin:14px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:24px;line-height:1.2}.tile span{color:var(--mute);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;overflow:auto}
.panel h2{font-size:14px;margin:0 0 10px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:12px}
td.r,th.r{text-align:right}
td.heat{text-align:center;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;margin:3px 0;font-size:13px}
.barrow i{display:block;height:10px;border-radius:5px;background:var(--acc)}
.scroll{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.scroll th{position:sticky;top:0;background:var(--chip)}
textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20;overflow:auto;padding:24px 12px}
#modal .box{background:var(--bg);max-width:1000px;margin:0 auto;border-radius:12px;padding:18px;position:relative}
#modal .x{position:absolute;top:6px;right:12px;font-size:24px;cursor:pointer;background:none;border:0;color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.hero{width:100%;max-height:540px;object-fit:contain;background:var(--chip);border-radius:8px;display:block}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:68px;height:88px;object-fit:cover;border-radius:6px;background:var(--chip);cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.kv{display:grid;grid-template-columns:100px 1fr;gap:3px 10px;margin:10px 0}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
pre{background:var(--chip);padding:8px;border-radius:6px;overflow:auto;max-height:200px;white-space:pre-wrap;font-size:12px}
.err{color:var(--bad)}.empty{padding:40px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Sample Viewer</h1>
  <nav id="nav"></nav>
  <span id="sum"></span>
</header>
<main id="main"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" onclick="closeModal()" aria-label="Đóng">×</button><div id="mbody"></div></div></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("vi-VN");
const money = (v, cur) => v == null ? "—" : fmt(Math.round(v * 100) / 100) + (cur ? " " + cur : "");
const api = async (path, opt) => (await fetch(path, opt)).json();
const qs = o => new URLSearchParams(Object.fromEntries(Object.entries(o).filter(([, v]) => v !== "" && v != null))).toString();
const imgSrc = (local, remote) => local ? "/img?" + qs({p: local}) : (remote || "");
const TABS = {products: "Sản phẩm", overview: "Tổng quan", sql: "SQL"};
const FILTERS = {source: "Nguồn", category_l1: "Nhóm", category_l2: "Nhóm con", audience: "Đối tượng"};
let facets = {}, state = {tab: "products", f: {source: "", category_l1: "", category_l2: "", audience: "", q: "", sort: "source"}, page: 1};

function nav() {
  $("#nav").innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="${state.tab === k ? "on" : ""}" onclick="go('${k}')">${v}</button>`).join("");
}
function go(t) { state.tab = t; nav(); ({products: viewProducts, overview: viewOverview, sql: viewSql}[t])(); }

/* ---------- Sản phẩm ---------- */
async function viewProducts() {
  const f = state.f;
  const pills = Object.entries(FILTERS).map(([k, label]) => `<div class="pills"><span class="lbl">${label}</span>
    <button class="pill ${f[k] === "" ? "on" : ""}" data-k="${k}" data-v="" onclick="setF(this.dataset.k,this.dataset.v)">Tất cả</button>
    ${(facets[k] || []).map(o => `<button class="pill ${f[k] === o.value ? "on" : ""}" data-k="${k}" data-v="${esc(o.value)}" onclick="setF(this.dataset.k,this.dataset.v)">${esc(o.value)}<small>${o.n}</small></button>`).join("")}</div>`).join("");
  $("#main").innerHTML = `${pills}
    <div class="bar">
      <input type="search" id="q" placeholder="Tìm theo tên, brand, danh mục…" value="${esc(f.q)}">
      <select id="sort"><option value="source">Sắp theo nguồn</option><option value="name">Tên A-Z</option><option value="price_asc">Giá tăng dần</option><option value="price_desc">Giá giảm dần</option><option value="images">Nhiều ảnh nhất</option></select>
      <span class="mute" id="count"></span>
    </div>
    <div id="list"></div><div class="pager" id="pager"></div>`;
  $("#sort").value = f.sort;
  $("#q").oninput = debounce(e => { f.q = e.target.value; state.page = 1; loadList(); }, 250);
  $("#sort").onchange = e => { f.sort = e.target.value; state.page = 1; loadList(); };
  loadList();
}
function setF(k, v) {
  state.f[k] = v; state.page = 1;
  const q = $("#q"); if (q) state.f.q = q.value;
  viewProducts();
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
async function loadList() {
  const d = await api("/api/products?" + qs({...state.f, page: state.page}));
  $("#count").textContent = `${fmt(d.total)} sản phẩm`;
  $("#list").innerHTML = d.items.length ? `<div class="grid">${d.items.map(card).join("")}</div>` : `<div class="empty">Không có sản phẩm nào khớp bộ lọc.</div>`;
  const pages = Math.max(Math.ceil(d.total / d.size), 1);
  $("#pager").innerHTML = pages > 1 ? `<button class="btn" ${d.page <= 1 ? "disabled" : ""} onclick="pg(${d.page - 1})">← Trước</button>
    <span>Trang ${d.page} / ${pages}</span><button class="btn" ${d.page >= pages ? "disabled" : ""} onclick="pg(${d.page + 1})">Sau →</button>` : "";
}
function pg(n) { state.page = n; loadList(); window.scrollTo({top: 0}); }
function card(p) {
  const src = imgSrc(p.img_local, p.image_url);
  return `<button class="item" data-key="${esc(p.product_key)}" onclick="openProduct(this.dataset.key)">
    <div class="thumb">${src ? `<img loading="lazy" src="${esc(src)}" alt="">` : "không có ảnh"}
      <span class="tag">${esc(p.source)}</span>${p.n_images > 1 ? `<span class="tag n">${p.n_images} ảnh</span>` : ""}</div>
    <div class="b"><div class="name">${esc(p.name)}</div>
      <div class="mute">${esc(p.brand_name || "—")}</div>
      <div><span class="price">${money(p.price, p.price_currency)}</span>${p.original_price && p.original_price > p.price ? `<span class="old">${money(p.original_price)}</span>` : ""}${p.discount_pct ? `<span class="off">-${Math.round(p.discount_pct)}%</span>` : ""}</div>
      <div><span class="chip">${esc(p.category_l1)}</span><span class="chip">${esc(p.category_l2)}</span><span class="chip">${esc(p.audience)}</span></div></div></button>`;
}

/* ---------- Chi tiết ---------- */
async function openProduct(key) {
  $("#modal").style.display = "block"; document.body.style.overflow = "hidden";
  $("#mbody").innerHTML = `<div class="empty">Đang tải…</div>`;
  const d = await api("/api/product?" + qs({key}));
  if (!d.product) { $("#mbody").innerHTML = `<div class="empty">Không tìm thấy sản phẩm.</div>`; return; }
  const p = d.product, imgs = d.media.filter(m => m.media_type === "image");
  const src = m => imgSrc(m.local_path, m.url);
  let attrs = p.attributes; try { attrs = JSON.stringify(JSON.parse(attrs), null, 2); } catch (e) {}
  $("#mbody").innerHTML = `<div class="cols"><div>
      ${imgs.length ? `<img class="hero" id="hero" src="${esc(src(imgs[0]))}" alt="">
        <div class="thumbs">${imgs.map((m, i) => `<img class="${i ? "" : "on"}" src="${esc(src(m))}" onclick="showImg(${i}, this)" alt="">`).join("")}</div>` : `<div class="empty">Không có ảnh</div>`}
    </div><div>
      <h3 style="margin:0 0 4px">${esc(p.name)}</h3>
      <div class="mute">${esc(p.brand_name || "—")} · ${esc(p.source)}</div>
      <div style="margin:10px 0"><span class="price" style="font-size:20px">${money(p.price, p.price_currency)}</span>${p.price_vnd && p.price_currency !== "VND" ? `<span class="mute"> ≈ ${money(p.price_vnd, "VND")}</span>` : ""}
        ${p.original_price && p.original_price > p.price ? `<span class="old">${money(p.original_price)}</span><span class="off">-${Math.round(p.discount_pct || 0)}%</span>` : ""}</div>
      <dl class="kv"><dt>Nhóm</dt><dd>${esc(p.category_l1)} › ${esc(p.category_l2)}</dd>
        <dt>Danh mục gốc</dt><dd>${esc(p.category_path || p.category_leaf || "—")}</dd>
        <dt>Đối tượng</dt><dd>${esc(p.audience)}${p.audience_inferred ? " (suy luận)" : ""}</dd>
        <dt>Tồn kho</dt><dd>${p.in_stock == null ? "—" : p.in_stock ? "Còn hàng" : "Hết hàng"}</dd>
        <dt>Số ảnh</dt><dd>${imgs.length}</dd>
        <dt>Theo dõi</dt><dd>${esc(p.first_seen)} → ${esc(p.last_seen)} (${p.n_snapshots} lần)</dd>
        <dt>Mã</dt><dd class="mute">${esc(p.product_key)}</dd>
        ${p.url ? `<dt>Link gốc</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">mở trang sản phẩm ↗</a></dd>` : ""}</dl>
      ${p.description ? `<h4 style="margin:12px 0 4px">Mô tả</h4><div style="white-space:pre-wrap">${esc(String(p.description).slice(0, 900))}</div>` : ""}
      ${d.history.length > 1 ? `<h4 style="margin:12px 0 4px">Lịch sử giá</h4><table><tr><th>Ngày</th><th class="r">Giá</th><th class="r">Giá VND</th></tr>
        ${d.history.map(h => `<tr><td>${esc(h.date_key)}</td><td class="r">${money(h.price, p.price_currency)}</td><td class="r">${fmt(h.price_vnd)}</td></tr>`).join("")}</table>` : ""}
      ${attrs ? `<h4 style="margin:12px 0 4px">Thuộc tính</h4><pre>${esc(attrs)}</pre>` : ""}
    </div></div>`;
  window.__imgs = imgs.map(src);
}
function showImg(i, el) {
  $("#hero").src = window.__imgs[i];
  document.querySelectorAll(".thumbs img").forEach(x => x.classList.toggle("on", x === el));
}
function closeModal() { $("#modal").style.display = "none"; document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- Tổng quan ---------- */
async function viewOverview() {
  $("#main").innerHTML = `<div class="empty">Đang tải…</div>`;
  const d = await api("/api/overview"), t = d.totals;
  const cats = [...new Set(d.matrix.map(r => r.category_l1))].sort();
  const cell = {}; d.matrix.forEach(r => cell[r.source + "|" + r.category_l1] = r.n);
  const max = Math.max(...d.matrix.map(r => r.n));
  const l2max = Math.max(...d.l2.map(r => r.n)), aud = d.audience, audmax = Math.max(...aud.map(r => r.n));
  $("#main").innerHTML = `<div class="tiles">
      ${[["Sản phẩm", t.products], ["Ảnh", t.images], ["Nguồn", t.sources], ["Nhóm", t.categories], ["Brand", t.brands]].map(([l, v]) => `<div class="tile"><b>${fmt(v)}</b><span>${l}</span></div>`).join("")}</div>
    <div class="panel"><h2>Theo nguồn</h2><table><tr><th>Nguồn</th><th class="r">Sản phẩm</th><th class="r">Ảnh</th><th class="r">Ảnh / sản phẩm</th><th class="r">Giá trung vị (VND)</th><th class="r">Giảm giá TB (%)</th></tr>
      ${d.by_source.map(s => `<tr><td>${esc(s.source)}</td><td class="r">${fmt(s.products)}</td><td class="r">${fmt(s.images)}</td><td class="r">${s.avg_images}</td><td class="r">${fmt(s.median_price_vnd)}</td><td class="r">${s.avg_discount ?? "—"}</td></tr>`).join("")}</table></div>
    <div class="panel"><h2>Nguồn × nhóm</h2><table><tr><th>Nguồn</th>${cats.map(c => `<th style="text-align:center">${esc(c)}</th>`).join("")}</tr>
      ${d.by_source.map(s => `<tr><td>${esc(s.source)}</td>${cats.map(c => { const n = cell[s.source + "|" + c] || 0; return `<td class="heat" style="background:color-mix(in srgb,var(--acc) ${Math.round(n / max * 55)}%,transparent)">${n || "·"}</td>`; }).join("")}</tr>`).join("")}</table></div>
    <div class="two"><div class="panel"><h2>Nhóm con</h2>${d.l2.map(r => `<div class="barrow"><span>${esc(r.category_l1)} › ${esc(r.category_l2)}</span><i style="width:${r.n / l2max * 100}%"></i><span class="mute">${r.n}</span></div>`).join("")}</div>
      <div class="panel"><h2>Đối tượng</h2>${aud.map(r => `<div class="barrow"><span>${esc(r.value)}</span><i style="width:${r.n / audmax * 100}%"></i><span class="mute">${r.n}</span></div>`).join("")}</div></div>`;
}

/* ---------- SQL ---------- */
const SQL_DEFAULT = "SELECT source, category_l1, count(*) AS n\nFROM pl\nGROUP BY ALL\nORDER BY n DESC";
function viewSql() {
  $("#main").innerHTML = `<div class="panel"><div class="mute" style="margin-bottom:6px">Bảng: <code>pl</code> (một dòng mỗi sản phẩm), <code>dim_product</code>, <code>dim_brand</code>, <code>dim_category</code>, <code>fact_media</code>, <code>fact_price_snapshot</code>. Chỉ cho phép đọc.</div>
    <textarea id="sql" spellcheck="false">${esc(sessionStorage.getItem("sql") || SQL_DEFAULT)}</textarea>
    <div class="bar" style="margin-top:8px"><button class="btn pri" onclick="runSql()">Chạy (Ctrl+Enter)</button><span class="mute" id="sqlinfo"></span></div></div>
    <div id="sqlout"></div>`;
  $("#sql").addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") runSql(); });
}
async function runSql() {
  const sql = $("#sql").value; sessionStorage.setItem("sql", sql);
  const d = await api("/api/sql", {method: "POST", body: JSON.stringify({sql})});
  if (d.error) { $("#sqlinfo").innerHTML = ""; $("#sqlout").innerHTML = `<div class="panel err">${esc(d.error)}</div>`; return; }
  $("#sqlinfo").textContent = `${d.rows.length} dòng · ${d.seconds}s${d.capped ? " (đã cắt ở 1000 dòng)" : ""}`;
  $("#sqlout").innerHTML = `<div class="scroll"><table><tr>${d.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
    ${d.rows.map(r => `<tr>${r.map(v => `<td>${esc(typeof v === "object" && v !== null ? JSON.stringify(v) : v)}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

(async () => {
  facets = await api("/api/facets");
  const o = await api("/api/overview");
  $("#sum").textContent = `${fmt(o.totals.products)} sản phẩm · ${fmt(o.totals.images)} ảnh · ${o.totals.sources} nguồn`;
  go("products");
})();
</script>
</body>
</html>
