# Cấu hình chung cho pipeline. Mọi bước đọc file này qua src/common/config.py.

paths:
  raw: data/raw            # file tải từ Kaggle (zip/csv gốc) — không sửa
  reports: data/reports    # báo cáo chất lượng dữ liệu, thống kê

# Tầng 1 — Data Lake trên object storage. Ghi đè backend bằng biến môi trường LAKE_BACKEND.
lake:
  backend: s3              # s3 (MinIO, `docker compose up -d minio`) | local (thư mục, dự phòng)
  local_root: data/lake
  s3:
    endpoint: 127.0.0.1:9000
    bucket: lake
    region: us-east-1
    use_ssl: false
    access_key: lakeadmin    # ghi đè bằng LAKE_ACCESS_KEY / LAKE_SECRET_KEY (.env)
    secret_key: lakeadmin123

# Tầng 2 — Data Warehouse (PostgreSQL, `docker compose up -d postgres`).
# Ghi đè bằng DW_HOST / DW_PORT / DW_USER / DW_PASSWORD (Airflow trong Docker dùng DW_HOST=postgres).
warehouse:
  host: 127.0.0.1
  port: 5432
  dbname: dw
  user: dw
  password: dw

duckdb:
  memory_limit: 12GB
  threads: 8

seed: 42

sources:
  hm:
    kind: competition
    slug: h-and-m-personalized-fashion-recommendations
    files: [articles.csv, customers.csv, transactions_train.csv]
  olist:
    kind: dataset
    slug: olistbr/brazilian-ecommerce
    files: [olist_orders_dataset.csv, olist_order_items_dataset.csv, olist_order_payments_dataset.csv,
            olist_order_reviews_dataset.csv, olist_customers_dataset.csv, olist_sellers_dataset.csv,
            olist_products_dataset.csv, product_category_name_translation.csv]
  shopee:
    kind: competition
    slug: shopee-product-matching
    files: [train.csv]
  # Bộ ảnh: tải nguyên zip vào data/raw/_zips (bị ngắt thì tải tiếp), chỉ giải nén thư mục `extract`.
  hm_images:
    kind: dataset
    slug: odins0n/hm256x256          # ảnh H&M thu nhỏ 256×256, tên file = article_id (2,3 GB)
    dir: hm
    files: [images_256_256]
    extract: images_256_256/
  shopee_images:
    kind: competition
    slug: shopee-product-matching
    dir: shopee
    files: [train_images]
    extract: train_images/

crawl:
  tiki:
    # id: url_key (url_key chỉ để đặt tên thư mục). Giày dép nữ (1703), túi nữ (976) không lấy.
    roots:
      931: thoi-trang-nu
      915: thoi-trang-nam
      1686: giay-dep-nam
      27616: tui-thoi-trang-nam
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
    min_interval: 1.0        # giây giữa 2 request; burst ~100 req/s bị WAF chặn ~15 phút
    listing_interval: 3.0
    listing_burst: 20        # /products listing bị chặn sau đúng 25 request dù 1 req/s hay 6 s/request
    listing_pause: 900       # nghỉ giữa các đợt listing; detail chạy trong lúc nghỉ
    block_wait: 1200
    max_blocks: 3
    detail_refresh_days: 7
    seller_refresh_days: 7
    review_products: 2000    # chỉ lấy review của N sản phẩm nhiều review nhất
    review_pages: 5          # 20 review/trang, mới nhất trước

  # Web riêng của các hãng: Haravan/Sapo/Shopify cùng mở /collections/all/products.json, không có WAF.
  # Haravan có inventory_quantity theo biến thể và sole_quantity (số đã bán); Sapo chỉ có tồn kho; Shopify
  # chỉ có available.
  brands:
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
    min_interval: 1.0        # giây giữa 2 request tới CÙNG một site
    workers: 6               # số site crawl song song
    shopify_interval: 3.0    # các site Shopify chạy lần lượt, chung giới hạn theo IP
    sites:
      aristino: {domain: aristino.com, platform: haravan}
      biluxury: {domain: biluxury.vn, platform: haravan}
      kenta: {domain: kenta.vn, platform: haravan}
      torano: {domain: torano.vn, platform: haravan}
      icondenim: {domain: icondenim.com, platform: haravan}
      pantio: {domain: pantio.vn, platform: haravan}
      nem: {domain: nemshop.vn, platform: haravan}
      evadeeva: {domain: evadeeva.com.vn, platform: haravan}
      marc: {domain: marc.com.vn, platform: haravan}
      chicland: {domain: chicland.vn, platform: haravan}
      coupletx: {domain: coupletx.com, platform: haravan}
      limeorange: {domain: limeorange.vn, platform: haravan}
      cocosin: {domain: cocosin.vn, platform: haravan}
      dottie: {domain: dottie.vn, platform: haravan}
      hades: {domain: hades.vn, platform: haravan}
      dirtycoins: {domain: dirtycoins.vn, platform: haravan}
      degrey: {domain: degrey.vn, platform: haravan}
      outerity: {domain: outerity.com, platform: haravan}
      swe: {domain: swe.vn, platform: haravan}
      dincox: {domain: dincox.com, platform: haravan}
      bitis: {domain: bitis.com.vn, platform: haravan}
      rabity: {domain: rabity.vn, platform: haravan}
      teelab: {domain: teelab.vn, platform: sapo}
      davies: {domain: davies.vn, platform: sapo}
      clownz: {domain: clownz.vn, platform: sapo}
      yame: {domain: yame.vn, platform: shopify}
      stussy: {domain: www.stussy.com, platform: shopify}
      gymshark: {domain: gymshark.com, platform: shopify}
      everlane: {domain: www.everlane.com, platform: shopify}
      allbirds: {domain: www.allbirds.com, platform: shopify}

  # API nội bộ của web Zara (không phải API công khai). robots.txt cấm /*/status/*?ajax=true (tồn kho) nên
  # không gọi; chỉ lấy danh mục và lưới sản phẩm theo danh mục.
  zara:
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
    store: vn/vi             # cửa hàng Việt Nam, giá VND
    sections: [WOMAN, MAN, KID]
    min_interval: 2.0

  # API nội bộ của web Uniqlo Mỹ (store vn đòi client id). Tồn kho theo SKU bị chặn trần ở 11 (= "11+").
  uniqlo:
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
    store: us
    lang: en
    genders: {22210: women, 22211: men, 22212: kids, 22213: baby}
    min_interval: 1.0
    detail_refresh_days: 7
    review_pages: 5          # 20 review/trang

sampling:
  # Lấy mẫu theo KHÁCH HÀNG (không theo sản phẩm) để giữ nguyên giỏ hàng.
  # Lấy trên toàn bộ khoảng thời gian (09/2018 – 09/2020) để còn so sánh cùng kỳ.
  n_customers: 100000

# Thuộc tính H&M không có, được SINH (§4.3 đề cương) — báo cáo phải ghi rõ là dữ liệu mô phỏng.
# Phân phối tham chiếu lấy từ Olist (D3) lúc chạy: cỡ shop, điểm review 1–5, độ trễ mua → review.
simulation:
  n_shops: 8
  # P(sản phẩm bán ở 1, 2, 3 shop). Olist có 96% sản phẩm chỉ 1 seller; đề tài cố ý tăng tỷ lệ
  # đa shop để việc gộp kết quả xuyên node có ý nghĩa (TB ≈ 1,85 shop/sản phẩm).
  shops_per_product: [0.40, 0.35, 0.25]
  node_of_shop: [A, A, B, B, C, C, C, C]   # phân mảnh mặc định 3 node (Hình 3.1)
  review_rate: 0.10        # xác suất một dòng mua phát sinh review (giả định, không có số liệu H&M)
  quality_sd: 0.8          # độ lệch chuẩn chất lượng ẩn của sản phẩm (thang logit)
  popularity_effect: 0.3   # sản phẩm bán chạy hơn → điểm cao hơn một chút
  scd2_change_rate: 0.02   # tỷ lệ article từng đổi department (để minh hoạ SCD Type 2)

quality:
  min_price: 0.0           # price phải > min_price
  age_range: [16, 100]
  max_batch_drift: 0.05    # Bronze: số dòng batch mới lệch > 5% so với batch trước → cảnh báo
